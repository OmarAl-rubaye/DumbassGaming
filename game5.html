<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the Number - DumbAssGaming</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="game5styles.css" />
    <script src="game5.js"></script>
</head>

<body>
    <div id="content">
        <header>
            <h1>Guess the Number</h1>
            <p>Arvaa luku 1–10. Sinulla on 5 yritystä.</p>
        </header>

        <main>
            <nav>
                <a class="button" href="index.html">Back to Home</a>
            </nav>

            <section class="card-grid">
                <article class="card game5-simple">
                    <h2>Arvauspeli</h2>
                    <p id="message">Paina <strong>Aloita alusta</strong> aloittaaksesi uuden pelin.</p>

                    <div class="game5-simple-row">
                        <label for="guessInput">Arvaus:</label>
                        <input id="guessInput" type="number" min="1" max="10" />
                    </div>

                    <div class="game5-simple-row">
                        <button id="guessBtn" class="button">Arvaa</button>
                        <button id="startBtn" class="button">Aloita alusta</button>
                    </div>

                    <div class="game5-simple-status">
                        <div>Yritykset jäljellä: <strong id="tries">5</strong></div>
                        <div>Oikein: <strong id="result">-</strong></div>
                    </div>
                </article>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Simple Games</p>
        </footer>
    </div>

    <script src="game5.js"></script>
</body>

</html>
